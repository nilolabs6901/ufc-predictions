name: Sync UFC Odds

# Auto-pulls live betting lines from The Odds API into the app and clears stale
# predictions so the model's market-signal factor stays current. Runs on a
# schedule and can be triggered manually from the Actions tab.
#
# Setup: the app needs ODDS_API_KEY set on Railway (free key from the-odds-api.com).
# Optional hardening: set CRON_SECRET on Railway AND as a repo secret of the same
# name so only this workflow can trigger the sync.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (≈120 calls/mo — well under the 500 free tier)
  workflow_dispatch: {}      # manual "Run workflow" button

jobs:
  sync-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger odds sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it under Settings → Secrets and variables → Actions, using the same value as CRON_SECRET on Railway. The sync endpoint rejects requests without a matching secret (HTTP 401)."
            exit 1
          fi
          echo "Triggering odds sync…"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://discerning-gentleness-production-6ec9.up.railway.app/api/sync?type=odds" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "content-type: application/json")
          echo "HTTP $code"
          cat /tmp/resp.json
          echo
          if [ "$code" = "401" ]; then
            echo "::error::Sync endpoint returned 401 (unauthorized). The CRON_SECRET repo secret does not match the CRON_SECRET set on Railway. Update one so they match."
          fi
          test "$code" = "200"
